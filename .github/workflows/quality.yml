name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate design tokens and icon sprite
        run: npm run build

      - name: Assert token exports are in sync with source
        run: |
          if ! git diff --quiet -- tokens/dist; then
            echo "::error::tokens/dist is out of date. Run 'npm run build:tokens' and commit the result."
            git --no-pager diff -- tokens/dist
            exit 1
          fi

      - name: Assert icon sprite is in sync with source
        run: git diff --exit-code -- assets/icons/sprite.svg

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint CSS (Stylelint)
        run: npm run lint:css

      - name: Lint Markdown (markdownlint)
        run: npm run lint:md

      - name: Validate portable package
        run: npm run validate

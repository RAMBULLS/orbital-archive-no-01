name: Migration candidate

on:
  push:
    branches: [chore/rb-domain-t09-orbital]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASELINE_SHA: 40d8141c6c20dd3c98a4ab76b32af54a55158d1b
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify generated icons and candidate
        run: |
          node scripts/build-icon-sprite.mjs
          git diff --exit-code -- assets/icons/lsm-icons.svg
          node scripts/validate.mjs
      - name: Prepare and verify rollback source
        run: |
          mkdir -p "$RUNNER_TEMP/rollback"
          git archive "$BASELINE_SHA" | tar -x -C "$RUNNER_TEMP/rollback"
          node "$RUNNER_TEMP/rollback/scripts/validate.mjs"
      - name: Build public packages and immutable manifests
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          scratch = pathlib.Path(os.environ["RUNNER_TEMP"])
          evidence = scratch / "evidence"
          evidence.mkdir()
          manifests = {}
          for label, source, sha in [("candidate", root, os.environ["GITHUB_SHA"]), ("rollback", scratch / "rollback", os.environ["BASELINE_SHA"])]:
              paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", sha], text=True).splitlines()
              paths = [p for p in paths if not p.startswith((".github/", ".git/"))]
              assert len(paths) == 242 and ".nojekyll" in paths
              assert not any(p.startswith((".agents/", ".ai/", ".codex/", ".gemini/")) or p in ["AGENTS.md", "CLAUDE.md", "GEMINI.md", ".env", "CNAME"] for p in paths)
              target = scratch / (label + "-site")
              target.mkdir()
              rows = []
              for name in paths:
                  src = source / name
                  assert src.is_file() and not src.is_symlink()
                  dst = target / name
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, dst)
                  body = dst.read_bytes()
                  rows.append({"path": name, "bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()})
              manifests[label] = {"source_sha": sha, "files": rows}
              (evidence / (label + "-manifest.json")).write_text(json.dumps(manifests[label], indent=2))
          baseline = {x["path"]: x["sha256"] for x in manifests["rollback"]["files"]}
          changed = [x["path"] for x in manifests["candidate"]["files"] if x["sha256"] != baseline[x["path"]]]
          assert len(changed) == 22
          (evidence / "changed-files.json").write_text(json.dumps(changed, indent=2))
      - name: Verify served resources and render wide and narrow pages
        shell: python
        run: |
          import functools, hashlib, http.server, json, os, pathlib, shutil, subprocess, threading, urllib.parse, urllib.request
          scratch = pathlib.Path(os.environ["RUNNER_TEMP"])
          evidence = scratch / "evidence"
          site = scratch / "candidate-site"
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=str(site))
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          origin = "http://127.0.0.1:" + str(server.server_port)
          results = []
          try:
              manifest = json.loads((evidence / "candidate-manifest.json").read_text())
              mime = {".html": "text/html", ".css": "text/css", ".json": "application/json", ".svg": "image/svg+xml", ".png": "image/png"}
              for item in manifest["files"]:
                  with urllib.request.urlopen(origin + "/" + urllib.parse.quote(item["path"]), timeout=10) as response:
                      body = response.read()
                      content_type = response.headers.get_content_type()
                      assert response.status == 200 and hashlib.sha256(body).hexdigest() == item["sha256"]
                      suffix = pathlib.Path(item["path"]).suffix
                      assert suffix not in mime or content_type == mime[suffix]
                      results.append({"path": item["path"], "status": response.status, "content_type": content_type, "sha256": item["sha256"]})
              try:
                  urllib.request.urlopen(origin + "/missing-migration-page.html", timeout=10)
                  raise AssertionError("Missing page unexpectedly served")
              except urllib.error.HTTPError as error:
                  assert error.code == 404
              chrome = shutil.which("google-chrome")
              assert chrome, "Hosted Chrome is unavailable"
              pages = ["index.html", "preview.html", "examples/index.html"] + sorted(p.relative_to(site).as_posix() for p in (site / "examples").glob("*.html") if p.name != "index.html")
              assert len(pages) == 16
              for page in pages:
                  for size in ["1440,1000", "390,844"]:
                      filename = page.replace("/", "-").replace(".html", "") + "-" + size.replace(",", "x") + ".png"
                      subprocess.run([chrome, "--headless", "--disable-gpu", "--hide-scrollbars", "--timeout=5000", "--virtual-time-budget=1000", "--window-size=" + size, "--screenshot=" + str(evidence / filename), origin + "/" + page], check=True, timeout=30, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      assert (evidence / filename).stat().st_size > 1000
              (evidence / "resource-results.json").write_text(json.dumps(results, indent=2))
          finally:
              server.shutdown()
              server.server_close()
      - name: Upload candidate Pages package without deploying
        uses: actions/upload-pages-artifact@v5
        with:
          name: orbital-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-site
          include-hidden-files: true
          retention-days: 3
      - name: Upload reconstructed rollback Pages package
        uses: actions/upload-pages-artifact@v5
        with:
          name: orbital-rollback-40d8141c6c20dd3c98a4ab76b32af54a55158d1b
          path: ${{ runner.temp }}/rollback-site
          include-hidden-files: true
          retention-days: 3
      - name: Upload verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: orbital-migration-verification-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          retention-days: 3
